<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analogy Preview (dev only)</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components/header.css">
    <link rel="stylesheet" href="css/components/pen.css">
    <link rel="stylesheet" href="css/components/animal-slot.css">
    <link rel="stylesheet" href="css/components/controls.css">
    <link rel="stylesheet" href="css/components/game-switcher.css">
    <link rel="stylesheet" href="css/game-modes/analogy.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <main class="game-container" id="game-container" role="main">
        <header class="game-header">
            <h1 class="game-title">"What Goes With?"</h1>
        </header>
        <div class="problem-area" id="problem-area"></div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/state.js"></script>
    <script src="js/problems.js"></script>
    <script src="js/components/AnimalSlot.js"></script>
    <script src="js/components/Pen.js"></script>
    <script src="js/interactions/animation.js"></script>
    <script src="js/interactions/selection.js"></script>
    <script src="js/interactions/drag.js"></script>
    <script src="js/renderers/AnalogyRenderer.js"></script>
    <script>
        window.addEventListener('load', function () {
            var problems = ProblemSet.getProblems();
            var analogy = problems.filter(function (p) { return p.type === 'Analogy'; });
            // Render the Sample (has large + medium + small animals to judge all sizes)
            var problem = analogy[0];
            AnalogyRenderer.render(problem, document.getElementById('problem-area'));
            document.title = 'rendered';
        });
    </script>
</body>
</html>
